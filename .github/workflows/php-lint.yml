name: PHP Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (PHP 8.2)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './epm' -prune -o -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
