name: PHP Lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP syntax (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.0', '8.2']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: none
      - name: Lint plugin PHP files
        shell: bash
        run: |
          set -euo pipefail
          find . -path './.git' -prune -o -path './epm' -prune -o -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l
